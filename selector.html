  return `<a class="p" href="${c.page}${q}"><b>${c.name.replace('富邦人壽','')}</b> <small>${c.code}${t?'｜'+TN(c,t):''}</small><br><span class="tag t-${['USD','TWD'].includes(c.cur)?c.cur:'o'}">${c.cur}</span><span class="tag t-ty">${c.type}</span><span class="tag t-dv">${c.dividend}</span><span class="tag ${c.payout=='累積型'?'t-acc':'t-pay'}">${c.payout}</span>${c.oiu?'<span class="tag t-h" style="background:#148f77">OIU 限境外客戶</span>':''}${c.hnw?'<span class="tag t-h">高資產客戶限定（北富銀活存 3,000 萬以上）</span>':''}${w?`<div class="warn">${w}</div>`:''}${nums}</a>`}).join('')).join('')||'<div class="card">無符合商品</div>';}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',run));run();
</script></body></html>
